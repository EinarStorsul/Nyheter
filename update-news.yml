name: Oppdater nyheter

on:
  schedule:
    # Kjører hver dag kl. 05:30 UTC (ca. 06:30/07:30 norsk tid, avhengig av sommertid)
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # gjør det mulig å trigge manuelt fra "Actions"-fanen på GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Hent nyheter
        run: python scripts/fetch_news.py

      - name: Commit og push oppdatert news.json
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add docs/news.json
          git diff --quiet --cached || git commit -m "Oppdater nyheter $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
